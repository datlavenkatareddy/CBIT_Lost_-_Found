<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="geomBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="metalBox" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <filter id="boxShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="400" height="300" fill="url(#geomBg)"/>

  <!-- Geometry Box Container -->
  <g filter="url(#boxShadow)">
    <!-- Metal Box Body -->
    <rect x="50" y="50" width="300" height="200" fill="url(#metalBox)" stroke="#0f172a" stroke-width="2"/>
    <rect x="58" y="58" width="284" height="184" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>

    <!-- 15cm Ruler / Scale -->
    <rect x="75" y="70" width="250" height="32" fill="#e2e8f0" stroke="#64748b" stroke-width="1"/>
    <!-- Ruler Markings -->
    <line x1="85" y1="70" x2="85" y2="85" stroke="#1e293b" stroke-width="1.5"/>
    <line x1="100" y1="70" x2="100" y2="78" stroke="#1e293b" stroke-width="1"/>
    <line x1="115" y1="70" x2="115" y2="85" stroke="#1e293b" stroke-width="1.5"/>
    <line x1="130" y1="70" x2="130" y2="78" stroke="#1e293b" stroke-width="1"/>
    <line x1="145" y1="70" x2="145" y2="85" stroke="#1e293b" stroke-width="1.5"/>
    <line x1="160" y1="70" x2="160" y2="78" stroke="#1e293b" stroke-width="1"/>
    <line x1="175" y1="70" x2="175" y2="85" stroke="#1e293b" stroke-width="1.5"/>
    <line x1="190" y1="70" x2="190" y2="78" stroke="#1e293b" stroke-width="1"/>
    <line x1="205" y1="70" x2="205" y2="85" stroke="#1e293b" stroke-width="1.5"/>
    <line x1="220" y1="70" x2="220" y2="78" stroke="#1e293b" stroke-width="1"/>
    <line x1="235" y1="70" x2="235" y2="85" stroke="#1e293b" stroke-width="1.5"/>
    <line x1="250" y1="70" x2="250" y2="78" stroke="#1e293b" stroke-width="1"/>
    <line x1="265" y1="70" x2="265" y2="85" stroke="#1e293b" stroke-width="1.5"/>
    <line x1="280" y1="70" x2="280" y2="78" stroke="#1e293b" stroke-width="1"/>
    <line x1="295" y1="70" x2="295" y2="85" stroke="#1e293b" stroke-width="1.5"/>
    <text x="85" y="96" font-family="monospace" font-size="8" fill="#1e293b">0</text>
    <text x="145" y="96" font-family="monospace" font-size="8" fill="#1e293b">5</text>
    <text x="205" y="96" font-family="monospace" font-size="8" fill="#1e293b">10</text>
    <text x="265" y="96" font-family="monospace" font-size="8" fill="#1e293b">15 cm</text>

    <!-- Protractor (180 deg) -->
    <path d="M 80 190 A 45 45 0 0 1 170 190 Z" fill="rgba(241, 245, 249, 0.85)" stroke="#64748b" stroke-width="1.5"/>
    <line x1="125" y1="190" x2="125" y2="150" stroke="#0284c7" stroke-width="1"/>
    <line x1="125" y1="190" x2="95" y2="160" stroke="#0284c7" stroke-width="1"/>
    <line x1="125" y1="190" x2="155" y2="160" stroke="#0284c7" stroke-width="1"/>
    <circle cx="125" cy="190" r="3" fill="#0f172a"/>

    <!-- Set Square (Triangle) -->
    <polygon points="185,190 255,190 185,120" fill="rgba(241, 245, 249, 0.85)" stroke="#64748b" stroke-width="1.5"/>
    <polygon points="195,182 235,182 195,142" fill="#0f172a" stroke="#64748b" stroke-width="1"/>

    <!-- Compass & Divider -->
    <g transform="translate(265, 115)">
      <!-- Compass Head -->
      <circle cx="25" cy="8" r="6" fill="#cbd5e1" stroke="#334155" stroke-width="1.5"/>
      <!-- Compass Legs -->
      <line x1="25" y1="14" x2="8" y2="105" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
      <line x1="25" y1="14" x2="42" y2="105" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
      <!-- Metal Points / Needle & Pencil -->
      <line x1="8" y1="105" x2="6" y2="118" stroke="#334155" stroke-width="2"/>
      <polygon points="40,95 44,95 43,118 41,118" fill="#eab308" stroke="#334155" stroke-width="1"/>
      <polygon points="41,118 43,118 42,124" fill="#0f172a"/>
      <!-- Tightening Knob -->
      <circle cx="25" cy="45" r="4" fill="#f59e0b"/>
      <line x1="18" y1="45" x2="32" y2="45" stroke="#334155" stroke-width="2"/>
    </g>

    <!-- Box Title text -->
    <text x="200" y="232" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#38bdf8" text-anchor="middle" letter-spacing="1">MATHEMATICAL INSTRUMENT BOX</text>
  </g>
</svg>
