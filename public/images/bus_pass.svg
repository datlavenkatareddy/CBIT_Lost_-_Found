<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="passBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="passShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="400" height="300" fill="url(#passBg)"/>

  <!-- Bus Pass Card -->
  <g filter="url(#passShadow)">
    <!-- Card Base -->
    <rect x="50" y="40" width="300" height="220" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    
    <!-- TSRTC Green Header -->
    <rect x="50" y="40" width="300" height="42" fill="#15803d"/>
    <text x="200" y="58" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">TELANGANA STATE RTC</text>
    <text x="200" y="73" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#bbf7d0" text-anchor="middle">STUDENT MONTHLY BUS PASS</text>

    <!-- Student Photo Slot -->
    <rect x="68" y="95" width="70" height="85" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
    <circle cx="103" cy="128" r="16" fill="#cbd5e1"/>
    <path d="M 83 165 C 83 148 123 148 123 165 Z" fill="#cbd5e1"/>
    <text x="103" y="174" font-family="system-ui, sans-serif" font-size="7" fill="#64748b" text-anchor="middle">PHOTO</text>

    <!-- Pass Details -->
    <g transform="translate(150, 95)" font-family="system-ui, sans-serif" font-size="10" fill="#1e293b">
      <text x="0" y="12" font-weight="bold">PASS NO:</text>
      <text x="60" y="12" fill="#b91c1c" font-weight="bold">HYD-2026-9481</text>

      <text x="0" y="28" font-weight="bold">NAME:</text>
      <text x="60" y="28">SANJAY REDDY</text>

      <text x="0" y="44" font-weight="bold">COLLEGE:</text>
      <text x="60" y="44">CBIT HYDERABAD</text>

      <text x="0" y="60" font-weight="bold">ROUTE NO:</text>
      <text x="60" y="60" font-weight="bold" fill="#15803d">10 (MEHDIPATNAM)</text>

      <text x="0" y="76" font-weight="bold">VALIDITY:</text>
      <text x="60" y="76" fill="#0369a1" font-weight="600">MAY 2026</text>
    </g>

    <!-- Barcode / Security Strip -->
    <rect x="68" y="195" width="264" height="28" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <!-- Barcode Lines -->
    <line x1="80" y1="200" x2="80" y2="218" stroke="#0f172a" stroke-width="2"/>
    <line x1="85" y1="200" x2="85" y2="218" stroke="#0f172a" stroke-width="1"/>
    <line x1="90" y1="200" x2="90" y2="218" stroke="#0f172a" stroke-width="3"/>
    <line x1="96" y1="200" x2="96" y2="218" stroke="#0f172a" stroke-width="1"/>
    <line x1="102" y1="200" x2="102" y2="218" stroke="#0f172a" stroke-width="2"/>
    <line x1="108" y1="200" x2="108" y2="218" stroke="#0f172a" stroke-width="4"/>
    <line x1="116" y1="200" x2="116" y2="218" stroke="#0f172a" stroke-width="1"/>
    <line x1="122" y1="200" x2="122" y2="218" stroke="#0f172a" stroke-width="2"/>
    <line x1="128" y1="200" x2="128" y2="218" stroke="#0f172a" stroke-width="3"/>
    <line x1="135" y1="200" x2="135" y2="218" stroke="#0f172a" stroke-width="1"/>
    
    <text x="235" y="214" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="#15803d">TSRTC AUTHORIZED PASS</text>

    <!-- Stamp -->
    <circle cx="305" cy="150" r="18" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="3 2"/>
    <text x="305" y="148" font-family="system-ui, sans-serif" font-size="7" font-weight="bold" fill="#dc2626" text-anchor="middle">TSRTC</text>
    <text x="305" y="157" font-family="system-ui, sans-serif" font-size="6" font-weight="bold" fill="#dc2626" text-anchor="middle">SEAL</text>
  </g>
</svg>
