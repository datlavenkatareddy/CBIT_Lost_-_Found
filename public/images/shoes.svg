<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="shoesBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="400" height="300" fill="url(#shoesBg)"/>

  <!-- Left Shoe (Background) -->
  <g filter="url(#dropShadow)" transform="translate(60, 60)">
    <!-- Sole -->
    <path d="M 30 140 Q 60 145 130 145 Q 210 145 245 130 Q 255 125 240 152 Q 180 162 100 160 Q 35 158 20 148 Z" fill="#e2e8f0"/>
    <path d="M 20 145 Q 60 155 140 155 Q 210 155 242 140 Q 248 148 235 155 Q 170 165 95 163 Q 30 160 18 150 Z" fill="#0284c7"/>
    <!-- Shoe Upper Body -->
    <path d="M 35 140 C 25 120 40 95 75 95 C 100 95 120 70 150 70 C 180 70 205 95 230 115 C 245 125 245 135 240 140 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <!-- Ankle Collar -->
    <path d="M 75 95 C 90 95 110 80 135 75 C 150 72 155 85 140 92 C 115 100 90 102 75 95 Z" fill="#0284c7"/>
    <!-- Three Stripes -->
    <path d="M 125 85 L 140 135" stroke="#0284c7" stroke-width="6" stroke-linecap="round"/>
    <path d="M 140 85 L 155 135" stroke="#0284c7" stroke-width="6" stroke-linecap="round"/>
    <path d="M 155 85 L 170 135" stroke="#0284c7" stroke-width="6" stroke-linecap="round"/>
    <!-- Laces -->
    <path d="M 150 75 Q 170 85 180 100" stroke="#94a3b8" stroke-width="3" fill="none"/>
    <path d="M 160 85 Q 180 95 190 108" stroke="#94a3b8" stroke-width="3" fill="none"/>
    <path d="M 175 98 Q 195 105 205 118" stroke="#94a3b8" stroke-width="3" fill="none"/>
    <!-- Toe Cap Accent -->
    <path d="M 210 115 Q 235 122 240 140" stroke="#0284c7" stroke-width="3" fill="none"/>
  </g>

  <!-- Tag / Label -->
  <rect x="260" y="240" width="115" height="30" fill="#0f172a" rx="0"/>
  <text x="317" y="260" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">SPORTS SHOES</text>
</svg>
