<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="pbBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="metalBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <filter id="pbShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="400" height="300" fill="url(#pbBg)"/>

  <!-- Power Bank Body -->
  <g filter="url(#pbShadow)">
    <!-- Main Aluminum Enclosure -->
    <rect x="90" y="45" width="220" height="210" rx="0" fill="url(#metalBody)" stroke="#94a3b8" stroke-width="2"/>
    
    <!-- Top Port Panel (Dark) -->
    <rect x="105" y="55" width="190" height="36" fill="#1e293b"/>
    
    <!-- USB-A Port 1 -->
    <rect x="118" y="65" width="34" height="16" fill="#0f172a" stroke="#475569" stroke-width="1"/>
    <rect x="123" y="70" width="24" height="6" fill="#e2e8f0"/>
    
    <!-- USB-C Port -->
    <rect x="165" y="68" width="28" height="10" rx="0" fill="#0f172a" stroke="#475569" stroke-width="1"/>
    
    <!-- Micro USB Port -->
    <rect x="204" y="68" width="22" height="10" rx="0" fill="#0f172a" stroke="#475569" stroke-width="1"/>

    <!-- LED Battery Indicator (4 white dots) -->
    <circle cx="245" cy="73" r="2.5" fill="#38bdf8"/>
    <circle cx="253" cy="73" r="2.5" fill="#38bdf8"/>
    <circle cx="261" cy="73" r="2.5" fill="#38bdf8"/>
    <circle cx="269" cy="73" r="2.5" fill="#64748b"/>

    <!-- Power Button -->
    <rect x="282" y="66" width="6" height="14" fill="#64748b" stroke="#334155" stroke-width="1"/>

    <!-- Mi Logo Embossed -->
    <rect x="185" y="145" width="30" height="30" fill="#ff6700" stroke="#ff6700" stroke-width="1"/>
    <text x="200" y="165" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">mi</text>

    <!-- Bottom Specs -->
    <text x="200" y="210" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#334155" text-anchor="middle">10000mAh</text>
    <text x="200" y="226" font-family="system-ui, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">18W FAST CHARGE</text>
  </g>
</svg>
