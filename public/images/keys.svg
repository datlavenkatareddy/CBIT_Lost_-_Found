<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="keysBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="keyShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="400" height="300" fill="url(#keysBg)"/>

  <g filter="url(#keyShadow)">
    <!-- Key Ring -->
    <circle cx="140" cy="140" r="35" fill="none" stroke="#64748b" stroke-width="8"/>
    <circle cx="140" cy="140" r="35" fill="none" stroke="#cbd5e1" stroke-width="4"/>

    <!-- Keychain Tag -->
    <polygon points="120,110 50,70 90,40 160,80" fill="#0284c7" stroke="#0369a1" stroke-width="2"/>
    <circle cx="130" cy="95" r="5" fill="#f8fafc"/>
    <text x="95" y="70" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#ffffff" transform="rotate(22, 95, 70)">ADMIN</text>

    <!-- Key 1 (Silver Brass) -->
    <g transform="translate(140, 140) rotate(15)">
      <!-- Key Bow -->
      <circle cx="0" cy="0" r="22" fill="#cbd5e1" stroke="#475569" stroke-width="2"/>
      <circle cx="0" cy="0" r="8" fill="#e2e8f0" stroke="#475569" stroke-width="1.5"/>
      <!-- Key Blade -->
      <rect x="20" y="-5" width="100" height="10" fill="#cbd5e1" stroke="#475569" stroke-width="2"/>
      <!-- Key Teeth -->
      <rect x="70" y="5" width="8" height="10" fill="#cbd5e1" stroke="#475569" stroke-width="1"/>
      <rect x="85" y="5" width="12" height="14" fill="#cbd5e1" stroke="#475569" stroke-width="1"/>
      <rect x="105" y="5" width="10" height="8" fill="#cbd5e1" stroke="#475569" stroke-width="1"/>
    </g>

    <!-- Key 2 (Golden Brass) -->
    <g transform="translate(140, 140) rotate(45)">
      <!-- Key Bow -->
      <polygon points="-18,-18 18,-18 22,0 18,18 -18,18 -22,0" fill="#facc15" stroke="#b45309" stroke-width="2"/>
      <circle cx="0" cy="0" r="7" fill="#fef08a" stroke="#b45309" stroke-width="1.5"/>
      <!-- Key Blade -->
      <rect x="20" y="-5" width="90" height="10" fill="#facc15" stroke="#b45309" stroke-width="2"/>
      <!-- Key Teeth -->
      <rect x="65" y="5" width="10" height="12" fill="#facc15" stroke="#b45309" stroke-width="1"/>
      <rect x="82" y="5" width="8" height="16" fill="#facc15" stroke="#b45309" stroke-width="1"/>
      <rect x="98" y="5" width="8" height="9" fill="#facc15" stroke="#b45309" stroke-width="1"/>
    </g>

    <!-- Key 3 (Dark Steel) -->
    <g transform="translate(140, 140) rotate(75)">
      <!-- Key Bow -->
      <circle cx="0" cy="0" r="20" fill="#94a3b8" stroke="#334155" stroke-width="2"/>
      <circle cx="0" cy="0" r="7" fill="#cbd5e1" stroke="#334155" stroke-width="1.5"/>
      <!-- Key Blade -->
      <rect x="18" y="-4" width="85" height="8" fill="#94a3b8" stroke="#334155" stroke-width="2"/>
      <!-- Key Teeth -->
      <rect x="60" y="4" width="8" height="10" fill="#94a3b8" stroke="#334155" stroke-width="1"/>
      <rect x="75" y="4" width="10" height="12" fill="#94a3b8" stroke="#334155" stroke-width="1"/>
      <rect x="90" y="4" width="8" height="7" fill="#94a3b8" stroke="#334155" stroke-width="1"/>
    </g>
  </g>
</svg>
